name: Build and Scan Container Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Container Image
      run: |
        docker build -t demo-web-app:latest .

    - name: Download and Run TMAS Scan
      env:
        TMAS_API_KEY: ${{ secrets.TMAS_API_KEY }}
      run: |
        curl -sL https://github.com/trendmicro/tm-v1-container-security-cli/releases/latest/download/tmas_Linux_x86_64.tar.gz | tar -xz
        ./tmas scan image demo-web-app:latest --apiKey $TMAS_API_KEY
