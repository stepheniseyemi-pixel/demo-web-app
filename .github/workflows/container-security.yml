name: Build and Scan Container Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Container Image
      run: |
        docker build -t demo-web-app:latest .

    - name: Scan Image with Trend Micro
      uses: trendmicro/container-image-scan-action@v1
      with:
        image: demo-web-app:latest
        api-key: ${{ secrets.TMAS_API_KEY }}
