name: Build and Scan Container Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Container Image
      run: |
        docker build -t demo-web-app:latest .

    - name: Scan Container Image with TMAS
      uses: trendmicro/tmas-scan-action@v3.3.1
      with:
        TMAS_API_KEY: ${{ secrets.TMAS_API_KEY }}
        imageToScan: 'demo-web-app:latest'
