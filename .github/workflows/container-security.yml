name: Build and Scan Container Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Build Container Image
      run: |
        docker build -t demo-web-app:latest .

    - name: Scan Image with Trend Micro TMAS
      uses: trendmicro/tm-v1-container-security-cil-action@v1
      with:
        image: 'demo-web-app:latest'
        api-key: ${{ secrets.TMAS_API_KEY }}
